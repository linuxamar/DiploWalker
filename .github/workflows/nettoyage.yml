name: Nettoyage automatique des Workflows

on:
  schedule:
    # S'exécute automatiquement le 1er de chaque mois à minuit (format Cron)
    - cron: '0 0 1 * *'
  workflow_dispatch:
    # Permet aussi de déclencher le nettoyage manuellement depuis l'onglet Actions

jobs:
  nettoyer:
    runs-on: ubuntu-latest

    # Étape cruciale : donner explicitement le droit d'écrire/supprimer les actions
    permissions:
      actions: write
      contents: read

    steps:
      - name: Supprimer les anciennes exécutions
        uses: Mattraks/delete-workflow-runs@v2
        with:
          token: ${{ github.token }}
          repository: ${{ github.repository }}

          # OPTIONS DE CONFIGURATION :
          # Conserver uniquement les résultats des 30 derniers jours
          retain_days: 30

          # Doit rester à 0. L'action applique ce minimum à la liste DÉJÀ filtrée
          # par âge (index.js : candidates.slice(-keep_minimum_runs)), et non à
          # l'historique complet : la rétention effective est donc
          # max(retain_days, keep_minimum_runs) et le nombre de runs vieux ne peut
          # jamais descendre sous cette valeur. Avec 6, et 6 runs de plus de 30
          # jours, runsToDelete vaut slice(0, 0) et rien n'est jamais supprimé.
          # Le plancher de sécurité est déjà assuré par retain_days, qui protège
          # les runs récents : ce réglage est donc redondant, et seulement nuisible.
          # 0 est indispensable — l'entrée omise retombe sur 6 (défaut de l'action).
          keep_minimum_runs: 0
