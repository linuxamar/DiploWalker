name: Build & Test (Windows Containers)

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  build-and-test:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          lfs: true  # Git LFS requis par le projet

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Windows test image
        run: docker build -t diplowalker-tests -f Docker/Dockerfile .

      - name: Run tests in container
        run: docker run --rm diplowalker-tests

      - name: Run tests with pipeline (alternative)
        run: docker run --rm diplowalker-tests ./pipeline.ps1 -DoTests -NoSignTests