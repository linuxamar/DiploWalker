name: Intégration continue

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  test:
    name: Build + tests
    if: github.ref_type != 'tag'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          lfs: true
      - uses: actions/setup-dotnet@v6.0.0
        with:
          dotnet-version: '10.0.x'
      - name: Restauration NuGet
        run: dotnet restore DiploWalker.slnx
      - name: Tests (10 projets, Release)
        shell: pwsh
        run: ./pipeline.ps1 -DoTests -Restore -NoSignTests

  release:
    name: Publication (tag v*)
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest
    # gh release create publie la page de release et televerse les installeurs.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          lfs: true
      - uses: actions/setup-dotnet@v6.0.0
        with:
          dotnet-version: '10.0.x'
      - name: Outils de publication (NSIS + git-crypt)
        shell: pwsh
        run: |
          choco install nsis -y --no-progress
          $version = "0.7.0"
          $exe = Join-Path $env:RUNNER_TEMP "git-crypt.exe"
          Invoke-WebRequest -Uri "https://github.com/AGWA/git-crypt/releases/download/$version/git-crypt-$version-x86_64.exe" -OutFile $exe
          if ((Get-Item $exe).Length -lt 1000000) {
            throw "git-crypt.exe téléchargée est trop petite : $(Get-Item $exe).Length octets"
          }
          $reported = (& $exe --version 2>&1 | Out-String).Trim()
          if ($reported -notmatch "0\.7\.0") {
            throw "Version git-crypt inattendue : $reported"
          }
          Write-Host "  git-crypt : $reported"
          $env:PATH = "$(Split-Path $exe);$env:PATH"
          Add-Content -Path $env:GITHUB_PATH -Value (Split-Path $exe)

          $searched = @(
            (Join-Path ${env:ProgramFiles(x86)} "NSIS")
            (Join-Path $env:ProgramFiles "NSIS")
            "C:\ProgramData\chocolatey\lib\nsis"
          )
          $nsisDir = $searched | Where-Object { Test-Path (Join-Path $_ "makensis.exe") } | Select-Object -First 1
          if (-not $nsisDir) {
            $found = Get-ChildItem "C:\ProgramData\chocolatey\lib" -Filter "makensis.exe" -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
            if ($found) { $nsisDir = $found.DirectoryName }
          }
          if (-not $nsisDir) {
            throw "makensis.exe introuvable après installation de NSIS. Chemins testés : $($searched -join ', ')"
          }
          Write-Host "  NSIS : $nsisDir"
          $env:PATH = "$nsisDir;$env:PATH"
          Add-Content -Path $env:GITHUB_PATH -Value $nsisDir
      - name: Déchiffrement de la PKI (git-crypt)
        shell: pwsh
        env:
          GIT_CRYPT_KEY: ${{ secrets.GIT_CRYPT_KEY }}
        run: |
          if (-not $env:GIT_CRYPT_KEY) {
            throw "Secret GIT_CRYPT_KEY absent : impossible de signer. C'est attendu pour une PR depuis une fork, mais pas pour une publication."
          }

          # `git-crypt unlock` refuse de dechiffrer si `git status` signale la moindre
          # modification suivi (commands.cpp : `git status -uno --porcelain`). Or la
          # conversion de fins de ligne est un source de differences sans rapport avec
          # le contenu : sur le runner Windows, actions/checkout materialise l'arbre
          # avec core.autocrlf, alors que git-crypt exige des octets exacts. On fige
          # donc LF (coherent avec .gitattributes) et on rematerialise l'arbre avant
          # de sonder, sinon le dechiffrement echoue sur une difference de CRLF.
          # L'etat est affiche : si ce garde-fou masque un vrai fichier modifie, il
          # faut le voir dans le log plutot que le decouvrir a la signature.
          $before = @(git status --porcelain -uno)
          Write-Host "  core.autocrlf avant : '$(git config core.autocrlf)'"
          Write-Host "  Fichiers modifies avant normalisation : $($before.Count)"
          if ($before.Count -gt 0) {
            $before | Select-Object -First 10 | ForEach-Object { Write-Host "    $_" }
          }

          git config --local core.autocrlf false
          git config --local core.eol lf
          git reset --hard --quiet HEAD

          $after = @(git status --porcelain -uno)
          Write-Host "  Fichiers modifies apres normalisation : $($after.Count)"
          if ($after.Count -gt 0) {
            $after | Select-Object -First 10 | ForEach-Object { Write-Host "    $_" }
            throw "L'arbre reste sale apres normalisation des fins de ligne : dechiffrement refuse pour ne pas ecraser du contenu. Voir la liste ci-dessus."
          }

          $keyFile = Join-Path $env:RUNNER_TEMP "git-crypt.key"
          [System.IO.File]::WriteAllBytes($keyFile, [System.Convert]::FromBase64String($env:GIT_CRYPT_KEY))
          try {
            git-crypt unlock $keyFile
          } finally {
            # La cle ne doit pas survivre a l'etape, meme en cas d'echec.
            if (Test-Path $keyFile) { Remove-Item $keyFile -Force }
          }

          $pfx = "certificates/codesigning/leaves/DiploWalker.Installer/DiploWalker.Installer.pfx"
          if (-not (Test-Path $pfx)) { throw "PFX de signature absent après déchiffrement : $pfx" }
      - name: Restauration NuGet
        run: dotnet restore DiploWalker.slnx
      - name: Tests
        shell: pwsh
        run: ./pipeline.ps1 -DoTests -Restore -NoSignTests
      - name: Publication self-contained (x64 + x86) + setup NSIS
        shell: pwsh
        run: ./pipeline.ps1 -DoPublish
      - name: Téléverser les artefacts
        uses: actions/upload-artifact@v7.0.1
        with:
          name: Diplo-Setup
          path: |
            Diplo-Setup-*.exe
            publish/WindowsServices/x64
            publish/WindowsServices/x86
      - name: Créer la GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $tag = "${{ github.ref_name }}"

          # La version des artefacts vient de Directory.Build.props, pas du tag :
          # un tag sans bump produirait des installeurs mal nommes. On refuse donc
          # de publier des binaires dont le nom contredit le tag.
          $props = [xml](Get-Content "Directory.Build.props" -Raw)
          $version = ($props.Project.PropertyGroup.Version | Where-Object { $_ } | Select-Object -First 1)
          if (-not $version) { $version = "" } else { $version = $version.Trim() }
          $expected = "v$version"
          if ($tag -ne $expected) {
            throw "Tag $tag incoherent avec Directory.Build.props (Version = $version). Attendu : $expected. Bump la version avant de taguer, sinon l'installeur sera mal nomme."
          }
          Write-Host "  Version declaree : $version (tag $tag)"

          $installers = @(Get-ChildItem -Path . -Filter "Diplo-Setup-*.exe" -File)
          if ($installers.Count -eq 0) {
            throw "Aucun installeur Diplo-Setup-*.exe n'a ete produit pour $tag."
          }
          foreach ($i in $installers) {
            Write-Host ("  {0} ({1:N1} Mo)" -f $i.Name, ($i.Length / 1MB))
          }

          # Table des assets construite hors du here-string : PowerShell n'a pas de
          # « if » en expression, donc $((if ...)) serait invalide.
          $rows = @()
          foreach ($i in $installers) {
            $arch = if ($i.Name -match 'x86') { 'x86' } else { 'x64' }
            $rows += "| ``$($i.Name)`` | $arch |"
          }
          $table = $rows -join "`n"

          # Notes de version generees sur place : pas de fichier a maintenir
          # dans l'arbre, et le contenu reflecte toujours ce qui a ete publie.
          $notes = @"
          ## DiploWalker $version

          Installeur Windows signe et horodate.

          | Asset | Architecture |
          | --- | --- |
          $table

          La charge utile des services Windows (x64 et x86) est jointe aux
          artefacts du run de workflow.

          ### Verification

          - Signatures Authenticode emises par la feuille de chaque projet,
            avec horodatage.
          - Cle de signature symetrique et certificats PKI chiffres par
            git-crypt au repos ; ils sont dechiffres sur le runner pour la
            seule duree de la publication.
          - Racine de demonstration non installee dans le magasin de
            confiance : `signtool verify /pa` signale `0x800B010A`
            (`CERT_E_UNTRUSTEDROOT`), ce qui est attendu. La chaine
            embarquee et l'horodatage restent presents.

          Installateur signe par une PKI de demonstration : aConsiderer comme
          un canal de test, pas comme une distribution de confiance.
          "@
          $notesFile = Join-Path $env:RUNNER_TEMP "notes.md"
          [System.IO.File]::WriteAllText($notesFile, $notes, (New-Object System.Text.UTF8Encoding($false)))

          # Reexecution d'un tag deja publie : on met a jour la page au lieu
          # d'echouer sur "release already exists". Le probe tourne avec
          # ErrorActionPreference = Continue : sous PowerShell 7, un appel natif
          # qui ecrit sur stderr declenche une erreur TERMINANTE sous 'Stop', donc
          # l'absence de release interromprait le script au lieu de renvoyer un
          # code de sortie a tester.
          $exists = $false
          $ErrorActionPreference = 'Continue'
          gh release view $tag *> $null
          $exists = ($LASTEXITCODE -eq 0)
          $ErrorActionPreference = 'Stop'

          if ($exists) {
            Write-Host "  Release $tag deja presente : mise a jour des notes et des assets."
            gh release edit $tag --title "DiploWalker $version" --notes-file $notesFile *> $null
            foreach ($i in $installers) {
              gh release upload $tag $i.FullName --clobber *> $null
            }
          } else {
            gh release create $tag `
              --title "DiploWalker $version" `
              --notes-file $notesFile `
              --verify-tag `
              @($installers | ForEach-Object { $_.FullName })
          }

          # Le tag seul ne donne aucune page : on verifie que la release existe
          # vraiment et que l'installeur est telechargeable.
          $url = gh release view $tag --json url --jq .url
          if (-not $url) { throw "La release $tag n'a pas ete creee." }
          $assets = @(gh release view $tag --json assets --jq ".assets[].name")
          foreach ($i in $installers) {
            if ($assets -notcontains $i.Name) {
              throw "Asset manquant sur la release $tag : $($i.Name)"
            }
          }
          Write-Host "  Release : $url"
          Write-Host "  Assets  : $($assets -join ', ')"
