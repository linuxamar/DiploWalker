name: CI

on:
  push:
    branches: [ dev, main ]
  pull_request:
    branches: [ dev, main ]
  workflow_dispatch:

jobs:
  test:
    name: Build + tests
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Restauration NuGet
        run: dotnet restore Diplo.slnx
      - name: Tests (11 projets, Release)
        shell: pwsh
        run: ./pipeline.ps1 -DoTests -Restore

  release:
    name: Publication (tag v*)
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Installer NSIS
        shell: pwsh
        run: choco install nsis -y --no-progress
      - name: Restauration NuGet
        run: dotnet restore Diplo.slnx
      - name: Tests
        shell: pwsh
        run: ./pipeline.ps1 -DoTests -Restore
      - name: Publication self-contained (x64 + x86) + setup NSIS
        shell: pwsh
        run: ./pipeline.ps1 -DoPublish
      - name: Téléverser les artefacts
        uses: actions/upload-artifact@v4
        with:
          name: Diplo-Setup
          path: |
            Diplo-Setup-*.exe
            publish/WindowsServices/x64
            publish/WindowsServices/x86
