syntax = "proto3";

option csharp_namespace = "Diplo.Grpc.Network";

package diplo.network;

service NetworkService {
  rpc CreateNetwork(CreateNetworkRequest) returns (CreateNetworkResponse);
  rpc RemoveNetwork(RemoveNetworkRequest) returns (RemoveNetworkResponse);
  rpc InspectNetwork(InspectNetworkRequest) returns (InspectNetworkResponse);
  rpc ListNetworks(ListNetworksRequest) returns (ListNetworksResponse);
  rpc ConnectContainer(ConnectContainerRequest) returns (ConnectContainerResponse);
  rpc DisconnectContainer(DisconnectContainerRequest) returns (DisconnectContainerResponse);
  rpc RunCniPlugin(RunCniPluginRequest) returns (RunCniPluginResponse);
}

enum NetworkDriver {
  BRIDGE = 0;
  CUSTOM_CNI = 1;
  NONE = 2;
  POD = 3;
}

enum EndpointState {
  ACTIVE = 0;
  INACTIVE = 1;
}

message CreateNetworkRequest {
  string name = 1;
  NetworkDriver driver = 2;
  string subnet = 3;
  string gateway = 4;
  string ip_range = 5;
  map<string, string> options = 6;
  map<string, string> labels = 7;
  string cni_plugin_path = 8;
}

message CreateNetworkResponse {
  string id = 1;
  string name = 2;
  NetworkDriver driver = 3;
  string subnet = 4;
  string gateway = 5;
  string created_at = 6;
}

message RemoveNetworkRequest {
  string id = 1;
  bool force = 2;
}

message RemoveNetworkResponse {
  bool success = 1;
  string message = 2;
}

message InspectNetworkRequest {
  string id = 1;
}

message InspectNetworkResponse {
  string id = 1;
  string name = 2;
  NetworkDriver driver = 3;
  string subnet = 4;
  string gateway = 5;
  string ip_range = 6;
  map<string, string> options = 7;
  map<string, string> labels = 8;
  repeated EndpointInfo endpoints = 9;
  string created_at = 10;
}

message ListNetworksRequest {
  map<string, string> filters = 1;
}

message NetworkInfo {
  string id = 1;
  string name = 2;
  NetworkDriver driver = 3;
  string subnet = 4;
  string gateway = 5;
  int32 endpoint_count = 6;
  string created_at = 7;
}

message ListNetworksResponse {
  repeated NetworkInfo networks = 1;
}

message ConnectContainerRequest {
  string network_id = 1;
  string container_id = 2;
  string endpoint_id = 3;
  string ipv4_address = 4;
  map<string, string> options = 5;
}

message ConnectContainerResponse {
  string endpoint_id = 1;
  string ipv4_address = 2;
  string mac_address = 3;
  string message = 4;
}

message DisconnectContainerRequest {
  string network_id = 1;
  string container_id = 2;
  string endpoint_id = 3;
  bool force = 4;
}

message DisconnectContainerResponse {
  bool success = 1;
  string message = 2;
}

message EndpointInfo {
  string endpoint_id = 1;
  string container_id = 2;
  string ipv4_address = 3;
  string mac_address = 4;
  EndpointState state = 5;
}

message RunCniPluginRequest {
  string plugin_path = 1;
  string command = 2;
  string container_id = 3;
  string netns_path = 4;
  CniConfiguration config = 5;
}

message CniConfiguration {
  string name = 1;
  string type = 2;
  string subnet = 3;
  string gateway = 4;
  string ip_range = 5;
  bool hairpin_mode = 6;
  bool is_default_gateway = 7;
  map<string, string> dns = 8;
}

message RunCniPluginResponse {
  bool success = 1;
  string ifname = 2;
  string ipv4_address = 3;
  string gateway = 4;
  string message = 5;
}
