syntax = "proto3";

option csharp_namespace = "Diplo.Grpc.Volume";

package diplo.volume;

service VolumeService {
  rpc CreateVolume(CreateVolumeRequest) returns (CreateVolumeResponse);
  rpc RemoveVolume(RemoveVolumeRequest) returns (RemoveVolumeResponse);
  rpc InspectVolume(InspectVolumeRequest) returns (InspectVolumeResponse);
  rpc ListVolumes(ListVolumesRequest) returns (ListVolumesResponse);
  rpc MountVolume(MountVolumeRequest) returns (MountVolumeResponse);
  rpc UnmountVolume(UnmountVolumeRequest) returns (UnmountVolumeResponse);
  rpc PruneVolumes(PruneVolumesRequest) returns (PruneVolumesResponse);
}

enum StorageDriverType {
  LOCAL = 0;
  NFS = 1;
  SMB = 2;
  CLOUD_AZURE = 3;
  CLOUD_AWS = 4;
  CLOUD_GCP = 5;
}

enum MountState {
  UNMOUNTED = 0;
  MOUNTED = 1;
  ERROR = 2;
}

message CreateVolumeRequest {
  string name = 1;
  StorageDriverType driver = 2;
  map<string, string> driver_opts = 3;
  map<string, string> labels = 4;
}

message CreateVolumeResponse {
  string id = 1;
  string name = 2;
  StorageDriverType driver = 3;
  string mountpoint = 4;
  string created_at = 5;
}

message RemoveVolumeRequest {
  string id = 1;
  bool force = 2;
}

message RemoveVolumeResponse {
  bool success = 1;
  string message = 2;
}

message InspectVolumeRequest {
  string id = 1;
}

message InspectVolumeResponse {
  string id = 1;
  string name = 2;
  StorageDriverType driver = 3;
  string mountpoint = 4;
  MountState state = 5;
  map<string, string> labels = 6;
  map<string, string> driver_opts = 7;
  int64 size_bytes = 8;
  string created_at = 9;
}

message ListVolumesRequest {
  map<string, string> filters = 1;
}

message VolumeInfo {
  string id = 1;
  string name = 2;
  StorageDriverType driver = 3;
  string mountpoint = 4;
  MountState state = 5;
  map<string, string> labels = 6;
  int64 size_bytes = 7;
}

message ListVolumesResponse {
  repeated VolumeInfo volumes = 1;
}

message MountVolumeRequest {
  string id = 1;
  string target_path = 2;
  map<string, string> options = 3;
}

message MountVolumeResponse {
  MountState state = 1;
  string mountpoint = 2;
  string message = 3;
}

message UnmountVolumeRequest {
  string id = 1;
  string target_path = 2;
}

message UnmountVolumeResponse {
  MountState state = 1;
  string message = 2;
}

message PruneVolumesRequest {}

message PruneVolumesResponse {
  repeated string volumes_deleted = 1;
  int32 count = 2;
  string message = 3;
}
