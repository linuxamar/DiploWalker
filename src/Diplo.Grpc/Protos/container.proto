syntax = "proto3";

option csharp_namespace = "Diplo.Grpc.Container";

package diplo.container;

service ContainerService {
  rpc CreateContainer(CreateContainerRequest) returns (CreateContainerResponse);
  rpc StartContainer(StartContainerRequest) returns (StartContainerResponse);
  rpc StopContainer(StopContainerRequest) returns (StopContainerResponse);
  rpc DeleteContainer(DeleteContainerRequest) returns (DeleteContainerResponse);
  rpc InspectContainer(InspectContainerRequest) returns (InspectContainerResponse);
  rpc ListContainers(ListContainersRequest) returns (ListContainersResponse);
  rpc GetContainerLogs(GetContainerLogsRequest) returns (stream ContainerLogEntry);
  rpc ExecInContainer(ExecInContainerRequest) returns (stream ExecOutput);
  rpc PullImage(PullImageRequest) returns (PullImageResponse);
  rpc GetVersion(GetVersionRequest) returns (GetVersionResponse);
  rpc ListNamespaces(ListNamespacesRequest) returns (ListNamespacesResponse);
  rpc RenameContainer(RenameContainerRequest) returns (RenameContainerResponse);
  rpc TopContainer(TopContainerRequest) returns (TopContainerResponse);
  rpc GetContainerStats(GetContainerStatsRequest) returns (GetContainerStatsResponse);
  rpc ListImages(ListImagesRequest) returns (ListImagesResponse);
  rpc InspectImage(InspectImageRequest) returns (InspectImageResponse);
  rpc RemoveImage(RemoveImageRequest) returns (RemoveImageResponse);
  rpc TagImage(TagImageRequest) returns (TagImageResponse);
}

enum ContainerState {
  UNKNOWN = 0;
  CREATED = 1;
  RUNNING = 2;
  PAUSED = 3;
  STOPPED = 4;
  FAILED = 5;
}

message CreateContainerRequest {
  string name = 1;
  string image = 2;
  map<string, string> env = 3;
  repeated string command = 4;
  repeated string args = 5;
  map<string, string> labels = 6;
  uint32 pid_limit = 7;
  int64 memory_limit = 8;
  int64 cpu_shares = 9;
}

message CreateContainerResponse {
  string id = 1;
  string name = 2;
  ContainerState state = 3;
  string created_at = 4;
}

message StartContainerRequest {
  string id = 1;
}

message StartContainerResponse {
  ContainerState state = 1;
  string message = 2;
}

message StopContainerRequest {
  string id = 1;
  int32 timeout_seconds = 2;
}

message StopContainerResponse {
  ContainerState state = 1;
  string message = 2;
}

message DeleteContainerRequest {
  string id = 1;
  bool force = 2;
}

message DeleteContainerResponse {
  bool success = 1;
  string message = 2;
}

message InspectContainerRequest {
  string id = 1;
}

message InspectContainerResponse {
  string id = 1;
  string name = 2;
  string image = 3;
  ContainerState state = 4;
  string created_at = 5;
  string started_at = 6;
  string finished_at = 7;
  map<string, string> labels = 8;
  map<string, string> env = 9;
  int64 pid = 10;
  int64 exit_code = 11;
}

message ListContainersRequest {
  bool all = 1;
  map<string, string> filters = 2;
}

message ContainerInfo {
  string id = 1;
  string name = 2;
  string image = 3;
  ContainerState state = 4;
  string created_at = 5;
  map<string, string> labels = 6;
}

message ListContainersResponse {
  repeated ContainerInfo containers = 1;
}

message GetContainerLogsRequest {
  string id = 1;
  bool follow = 2;
  int32 tail = 3;
  string since = 4;
}

message ContainerLogEntry {
  string timestamp = 1;
  string stream = 2;
  string log = 3;
}

message ExecInContainerRequest {
  string id = 1;
  repeated string command = 2;
  bool attach_stdin = 3;
  bool attach_stdout = 4;
  bool attach_stderr = 5;
}

message ExecOutput {
  string stream = 1;
  bytes data = 2;
}

message PullImageRequest {
  string image = 1;
}

message PullImageResponse {
  string image = 1;
  string message = 2;
}

message GetVersionRequest {}
message GetVersionResponse {
  string version = 1;
  string revision = 2;
  string go_version = 3;
  string os = 4;
  string arch = 5;
}

message ListNamespacesRequest {}
message ListNamespacesResponse {
  repeated string namespaces = 1;
}

message RenameContainerRequest {
  string id = 1;
  string new_name = 2;
}

message RenameContainerResponse {
  bool success = 1;
  string message = 2;
}

message TopContainerRequest {
  string id = 1;
}

message TopContainerResponse {
  repeated ProcessInfo processes = 1;
}

message ProcessInfo {
  int64 pid = 1;
  string user = 2;
  string command = 3;
  string cpu_percent = 4;
  string mem_percent = 5;
  int64 rss = 6;
}

message GetContainerStatsRequest {
  string id = 1;
}

message GetContainerStatsResponse {
  int64 cpu_usage = 1;
  int64 memory_usage = 2;
  int64 memory_limit = 3;
  int64 network_rx = 4;
  int64 network_tx = 5;
  int64 disk_read = 6;
  int64 disk_write = 7;
  double pids = 8;
}

message ListImagesRequest {
  string namespace_name = 1;
}

message ImageInfo {
  string ref = 1;
  string id = 2;
  string repository = 3;
  string tag = 4;
  int64 size = 5;
  string created_at = 6;
}

message ListImagesResponse {
  repeated ImageInfo images = 1;
}

message InspectImageRequest {
  string ref = 1;
  string namespace_name = 2;
}

message InspectImageResponse {
  string ref = 1;
  string id = 2;
  string repository = 3;
  string tag = 4;
  int64 size = 5;
  string created_at = 6;
  map<string, string> labels = 7;
}

message RemoveImageRequest {
  string ref = 1;
  string namespace_name = 2;
}

message RemoveImageResponse {
  bool success = 1;
  string message = 2;
}

message TagImageRequest {
  string source = 1;
  string target = 2;
  string namespace_name = 3;
}

message TagImageResponse {
  string source = 1;
  string target = 2;
  string message = 3;
}
